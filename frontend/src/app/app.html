<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/>
          <path d="M5 19l7-7"/>
        </svg>
      </span>
      <span>
        <strong>Waste Zero</strong>
        <small>Smart food management</small>
      </span>
    </a>

    <div>
      <div class="nav-label">Workspace</div>
      <nav class="nav">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <a class="nav-link" routerLink="/menu-management" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h13M8 12h13M8 18h13"/>
            <circle cx="3.5" cy="6" r="1"/>
            <circle cx="3.5" cy="12" r="1"/>
            <circle cx="3.5" cy="18" r="1"/>
          </svg>
          <span>Menu Management</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <span class="avatar-ring">ل</span>
      <div>
        <strong>لقمة ولقيمة</strong>
        <small>Restaurant Team</small>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
